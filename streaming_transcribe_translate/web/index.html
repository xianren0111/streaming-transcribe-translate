<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-token" content="__TOKEN__">
<meta name="referrer" content="no-referrer">
<title>同传字幕</title>
<link rel="stylesheet" href="/app.css?t=__TOKEN__">
</head>
<body>
<div id="disconnected" class="disconnected" hidden data-i18n="与程序的连接中断，正在重新连接…"></div>

<div id="startup-error" class="app startup-error card" hidden>
  <h2 id="startup-error-title"></h2>
  <p id="startup-error-message"></p>
  <p class="small" data-i18n="请关闭此页面，解决问题后重新打开程序。"></p>
</div>

<div id="app" class="app" hidden>
  <!-- ===================== Home ===================== -->
  <section id="page-home">
    <header class="topbar">
      <h1 data-i18n="同传字幕"></h1>
      <span class="status-pill" id="status-pill" role="status"><span class="dot" id="status-dot"></span><span id="status-title"></span></span>
      <span class="spacer"></span>
      <button class="pill-button icon-button" id="settings-button" data-i18n-title="设置" data-i18n-aria="设置" type="button">⚙</button>
      <button class="pill-button" id="theme-button" type="button"></button>
      <select class="select-small" id="language-select" data-i18n-aria="语言"></select>
    </header>
    <p class="tagline" data-i18n="听见每一句，轻松翻译与分享"></p>

    <div class="columns">
      <div>
        <div class="card" id="connection-card">
          <p class="small" id="status-detail"></p>
          <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">

          <label class="field-label" for="room-url" data-i18n="直播间链接"></label>
          <input type="text" id="room-url" autocomplete="off" spellcheck="false" data-i18n-ph="粘贴直播间链接，会自动识别平台">
          <div class="row">
            <label for="platform-select" data-i18n="直播平台"></label>
            <select id="platform-select" class="grow"></select>
          </div>

          <div class="row">
            <label for="audio-input" data-i18n="声音来源"></label>
            <select id="audio-input" class="grow"></select>
          </div>
          <div class="row" id="microphone-row" hidden>
            <select id="microphone-select" class="grow"></select>
            <button class="btn" id="refresh-microphones" type="button" data-i18n="刷新麦克风"></button>
          </div>
          <p class="hint" data-i18n="麦克风和电脑声音可直接使用，无需登录。发送聊天才需要账号。"></p>

          <div class="row">
            <select id="source-language" class="grow" data-i18n-aria="原文语言"></select>
            <span class="arrow">→</span>
            <div id="target-language" class="grow reading-languages" role="group" data-i18n-aria="字幕语言"></div>
          </div>
          <p class="hint" data-i18n="自动识别原文语言 → 你想阅读的字幕语言"></p>
          <p class="hint" data-i18n="阅读语言可多选，同时显示多语言字幕；审核和发送仅使用一种语言。停止字幕后可修改语言。"></p>

          <div class="row">
            <span data-i18n="发送方式"></span>
            <span class="spacer"></span>
            <button class="toggle" id="chat-mode" type="button" aria-pressed="false"></button>
          </div>
          <p class="hint" data-i18n="默认手动审核；开启自动后，每条译文直接发送。"></p>

          <div class="login-row">
            <span class="status" id="login-status"></span>
            <button class="btn" id="login-button" type="button"></button>
          </div>

          <button class="btn primary big" id="start-button" type="button"></button>
          <p class="small" id="service-summary"></p>
        </div>

        <div class="card" id="overlay-card">
          <h2 data-i18n="字幕窗口"></h2>
          <div class="row" id="desktop-overlay-row">
            <button class="btn primary grow" id="desktop-overlay-toggle" type="button"></button>
            <button class="btn" id="desktop-overlay-unlock" type="button" data-i18n="解锁悬浮窗" hidden></button>
            <button class="btn" id="pause-toggle" type="button" hidden></button>
          </div>
          <p class="hint" id="desktop-overlay-hint" data-i18n="悬浮窗始终置顶，可拖动、右下角调整大小；鼠标移入显示工具栏。"></p>
          <p class="hint" data-i18n="在 OBS 中添加「浏览器」来源，粘贴下面的网址，即可显示大字幕。也可以直接在浏览器中打开。"></p>
          <div class="overlay-box">
            <input type="text" id="overlay-url" readonly aria-label="OBS URL">
            <button class="btn" id="copy-overlay" type="button" data-i18n="复制网址"></button>
            <button class="btn" id="open-overlay" type="button" data-i18n="打开预览"></button>
          </div>
        </div>
      </div>

      <div>
        <div class="card" id="review-card">
          <div class="review-title">
            <h2 id="review-title"></h2>
          </div>
          <div class="chat-options">
            <label class="field-label" for="chat-language" data-i18n="审核和发送语言"></label>
            <select id="chat-language" data-opt="chat_language"></select>
            <label class="field-label" for="chat-template" data-i18n="发送模板"></label>
            <input id="chat-template" type="text" data-opt="chat_template">
            <button class="btn" id="reset-chat-template" type="button" data-i18n="使用当前界面语言的默认模板"></button>
            <p class="hint" data-i18n="模板支持 {translation}、{original}、{language}；修改仅用于新译文，当前审核文字不变。"></p>
          </div>
          <p id="chat-limit-hint" class="hint"></p>
          <h3 data-i18n="当前原文（参考）"></h3>
          <div class="ref-original" id="draft-original"></div>
          <div class="review-title" style="margin-top:12px">
            <h3 data-i18n="当前译文 · 可编辑"></h3>
            <span class="chat-status" id="chat-status" role="status"></span>
          </div>
          <textarea id="draft-text" rows="3" disabled></textarea>
          <div class="actions">
            <label class="queue-retention" for="queue-retention">
              <span data-i18n="保留数量"></span>
              <input id="queue-retention" type="number" data-opt="retained_sentences" min="1" max="200" step="1">
            </label>
            <div class="right">
              <button class="btn primary" id="send-button" type="button" disabled data-i18n="发送到直播间"></button>
              <button class="btn" id="skip-button" type="button" disabled data-i18n="跳过"></button>
            </div>
          </div>

          <div class="queue" id="queue" hidden>
            <h3 id="queue-title"></h3>
            <div id="queue-list"></div>
          </div>
        </div>
        <p class="footer-note" data-i18n="声音在本机识别；翻译文字会发给翻译服务。只有你选择发送后，字幕才会发到直播间聊天。"></p>
        <p style="margin:18px 0 0;text-align:right"><button class="btn outline" id="quit-button" type="button" data-i18n="退出程序"></button></p>
      </div>
    </div>
  </section>

  <!-- ===================== Settings ===================== -->
  <section id="page-settings" hidden>
    <header class="topbar">
      <button class="back" id="back-button" type="button" data-i18n="‹ 返回"></button>
      <h1 data-i18n="设置"></h1>
      <span class="spacer"></span>
      <button class="pill-button" id="theme-button-2" type="button"></button>
      <select class="select-small" id="language-select-2" data-i18n-aria="语言"></select>
    </header>
    <div class="tabs-wrap">
      <div class="tabs" role="tablist" id="settings-tabs">
        <button class="tab" role="tab" data-tab="翻译" data-i18n="翻译" type="button"></button>
        <button class="tab" role="tab" data-tab="记录" data-i18n="记录" type="button"></button>
        <button class="tab" role="tab" data-tab="关于" data-i18n="关于" type="button"></button>
      </div>
    </div>

    <div class="settings-body">
      <!-- 翻译 -->
      <div data-panel="翻译">
        <div class="card">
          <h2 data-i18n="模式 / 背景与术语"></h2>
          <select id="opt-preset" data-opt="preset" style="width:100%"></select>
          <div class="actions"><button class="btn" id="edit-preset" type="button" data-i18n="编辑背景和术语表"></button><span></span></div>
        </div>
        <div class="card">
          <h2 data-i18n="结合上下文翻译"></h2>
          <label class="check"><input type="checkbox" data-opt="use_context"><span data-i18n="参考之前已完成的原文和译文"></span></label>
          <label class="field-label" data-i18n="参考前面几句（越多可能越慢）"></label>
          <div class="slider-row"><input type="range" data-slider="previous_sentences" min="0" max="8" step="1"><input type="number" data-opt="previous_sentences" min="0" max="8" step="1"></div>
        </div>
        <div class="card">
          <h2 data-i18n="字幕怎么出现"></h2>
          <select id="opt-display-mode" data-opt="display_mode" style="width:100%"></select>
          <label class="check"><input type="checkbox" data-opt="deduplicate"><span data-i18n="去掉同一条识别结果内重复的字句（也可能去掉真实重复）"></span></label>
          <label class="check"><input type="checkbox" data-opt="ignore_onomatopoeia"><span data-i18n="忽略拟声词 · 仅跳过整句笑声、叫声或常见拟声词，不翻译或发送"></span></label>
          <label class="check"><input type="checkbox" data-opt="semantic_sound_filter"><span data-i18n="拟声词语义过滤 · 使用翻译 API 判断中日英整句拟声词及语气声，增加费用和延迟，等待整句后显示"></span></label>
          <label class="check"><input type="checkbox" data-opt="distinguish_speakers"><span data-i18n="区分说话人 · 默认关闭，仅字幕和记录显示标签；短句或多人重叠可能分错，停止字幕后修改"></span></label>
          <div id="speaker-download-result" class="result" role="status" aria-live="polite"></div>
        </div>
        <div class="card">
          <h2 data-i18n="在线 Decisions 模型辅助（可选）"></h2>
          <p class="hint" data-i18n="开启后会把原文/译文发给 OpenCode Zen，不发送音频。网络失败会明确提示并跳过辅助。"></p>
          <label class="check"><input type="checkbox" data-opt="smart_segmentation"><span data-i18n="智能断句 · 暂停时判断是否说完，最多额外等待约 1 秒"></span></label>
          <label class="check"><input type="checkbox" data-opt="check_translation"><span data-i18n="检查译文 · 有问题时重译一次，可能增加延迟"></span></label>
          <p class="small" data-i18n="OpenCode Zen（免费，不用 key）"></p>
        </div>

        <p class="small muted" style="margin:0 8px 6px">LLM API</p>
        <div class="card">
          <p class="hint" data-i18n="填写一个 OpenAI 兼容的翻译服务。声音识别在本机完成，只有识别出的文字会发送给此服务。"></p>
          <label class="field-label" for="api-base" data-i18n="服务地址（OpenAI 兼容）"></label>
          <input type="text" id="api-base" autocomplete="off" spellcheck="false" placeholder="https://api.openai.com/v1">
          <label class="field-label" for="api-model" data-i18n="模型 ID"></label>
          <div class="inline-input">
            <select id="model-select" hidden></select>
            <input type="text" id="api-model" autocomplete="off" spellcheck="false">
            <button class="btn" id="detect-models" type="button" data-i18n="检测模型"></button>
          </div>
          <p class="hint" data-i18n="填好服务地址（和 API Key）后点「检测模型」，即可从列表中选择。"></p>
          <label class="field-label" for="api-key">API Key</label>
          <div class="inline-input">
            <input type="password" id="api-key" autocomplete="new-password" spellcheck="false">
            <button class="btn" id="toggle-key" type="button" data-i18n="显示"></button>
          </div>
          <p class="small" id="key-status"></p>
          <p class="hint" data-i18n="服务地址示例：https://api.openai.com/v1\nAPI Key 只保存在这台电脑的配置文件中，不会发送给直播间。" style="white-space:pre-line"></p>
          <div class="result" id="api-result" role="status"></div>
          <div class="actions">
            <button class="btn danger-text" id="clear-key" type="button" data-i18n="清除已保存的 Key"></button>
            <div class="right">
              <button class="btn outline" id="save-api" type="button" data-i18n="保存"></button>
              <button class="btn primary" id="test-api" type="button" data-i18n="测试连接"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- 记录 -->
      <div data-panel="记录" hidden>
        <div class="card">
          <h2 data-i18n="字幕文本 / 使用记录"></h2>
          <label class="check"><input type="checkbox" data-opt="save_records"><span data-i18n="保存字幕和发送记录（用于导出时间轴）"></span></label>
          <label class="check"><input type="checkbox" data-opt="save_captions"><span data-i18n="发送成功或跳过时保存原文和当前译文"></span></label>
          <label class="check"><input type="checkbox" data-opt="diagnostics"><span data-i18n="记录原文、翻译提示词、译文和 Decisions 问答（不含音频或 key）"></span></label>
          <p class="hint" data-i18n="记录默认关闭。开启后，成功发送的消息会保存到本机，用于剪辑导出；关闭时不写入任何记录文件。记录可能包含私人对话，请谨慎分享。"></p>
          <button class="btn" id="open-records" type="button" data-i18n="打开本地记录文件夹" style="width:100%"></button>
          <label class="field-label" for="records-folder" data-i18n="记录保存文件夹"></label>
          <div class="inline-input">
            <input type="text" id="records-folder" readonly>
            <button class="btn" id="choose-records-folder" type="button" data-i18n="选择文件夹"></button>
          </div>
          <p class="hint" data-i18n="文件夹选择自动保存，从下次开始字幕生效；当前会话保留在原文件夹，不移动已有记录。"></p>
        </div>
        <div class="card">
          <h2 data-i18n="Final Cut Pro / 剪映：已审核字幕导出"></h2>
          <p class="hint" data-i18n="时间轴自动从开始字幕时计时。导出已发送和已跳过字幕，使用审核后的文字；CSV 标明发送或跳过。"></p>
          <label class="field-label" for="export-session" data-i18n="选择字幕会话"></label>
          <select id="export-session" style="width:100%"></select>
          <div class="actions"><span></span><button class="btn primary" id="export-sent" type="button" data-i18n="导出已审核 SRT + CSV"></button></div>
          <div class="result" id="export-result" role="status"></div>
        </div>
      </div>

      <!-- 关于 -->
      <div data-panel="关于" hidden>
        <div class="card">
          <h2 data-i18n="同传字幕"></h2>
          <p class="small" style="white-space:pre-line" data-i18n="本机语音识别 · 自选翻译服务 · 哔哩哔哩 / YouTube / 猫耳FM聊天\n借鉴 Simul Subtitle 的使用方式，Python 实现。\n接收时间不是源网站的直播时间码：直播缓冲/网络延迟仍需在剪辑软件中校正。SRT 不包含样式。"></p>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ===================== Modals ===================== -->
<div class="modal-backdrop" id="modal-message" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="message-title">
    <h2 id="message-title"></h2>
    <p id="message-body" style="white-space:pre-line"></p>
    <div class="buttons"><button class="btn" id="message-secondary" type="button" hidden></button><button class="btn primary" id="message-ok" type="button" data-i18n="好的"></button></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-login" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <h2 id="login-title"></h2>
    <p class="hint" data-i18n="Cookie 相当于登录凭证。只在本次运行中保存在内存，不会写入配置文件或日志。请勿发送给他人。"></p>
    <div class="result" id="login-result" role="status"></div>
    <button class="btn" id="qr-button" type="button" style="width:100%;margin-bottom:10px" hidden data-i18n="使用哔哩哔哩手机 App 扫码登录"></button>
    <textarea id="cookie-text" rows="7" spellcheck="false" autocomplete="off"></textarea>
    <p class="hint" data-i18n="可以粘贴 Cookie 请求头、Netscape 导出或 JSON 格式。"></p>
    <div class="buttons" style="justify-content:space-between">
      <button class="btn" id="firefox-button" type="button" data-i18n="从 Firefox 读取并验证"></button>
      <span style="display:flex;gap:8px">
        <button class="btn" id="login-close" type="button" data-i18n="关闭"></button>
        <button class="btn primary" id="cookie-verify" type="button" data-i18n="验证并使用"></button>
      </span>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-qr" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="qr-title">
    <h2 id="qr-title" data-i18n="哔哩哔哩扫码登录"></h2>
    <p id="qr-status" class="small"></p>
    <img id="qr-image" class="qr" alt="QR" hidden>
    <div class="buttons"><button class="btn" id="qr-close" type="button" data-i18n="关闭"></button></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-youtube" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="youtube-title">
    <h2 id="youtube-title" data-i18n="切换 YouTube 账号"></h2>
    <p class="small" id="youtube-hint" data-i18n="选择用于发送聊天的 YouTube 账号或频道。"></p>
    <div class="choices" id="youtube-choices" role="radiogroup"></div>
    <div class="buttons">
      <button class="btn" id="youtube-cancel" type="button" data-i18n="取消"></button>
      <button class="btn primary" id="youtube-confirm" type="button" data-i18n="使用此账号"></button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-preset" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="preset-title">
    <h2 id="preset-title"></h2>
    <label class="field-label" for="preset-background" data-i18n="背景说明"></label>
    <textarea id="preset-background" rows="5"></textarea>
    <label class="field-label" for="preset-glossary" data-i18n="术语表（每行一个，例如 原词: 译法）"></label>
    <textarea id="preset-glossary" rows="6"></textarea>
    <div class="buttons">
      <button class="btn" id="preset-cancel" type="button" data-i18n="取消"></button>
      <button class="btn primary" id="preset-apply" type="button" data-i18n="应用（再点保存字幕设置）"></button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-quit" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="quit-title">
    <h2 id="quit-title" data-i18n="退出程序"></h2>
    <p data-i18n="退出后字幕会停止，登录状态也会清除。确定退出吗？"></p>
    <div class="buttons">
      <button class="btn" id="quit-cancel" type="button" data-i18n="取消"></button>
      <button class="btn primary" id="quit-confirm" type="button" data-i18n="退出程序"></button>
    </div>
  </div>
</div>

<div id="goodbye" class="app startup-error card" hidden>
  <h2 data-i18n="程序已退出"></h2>
  <p data-i18n="现在可以关闭此页面。要再次使用，请重新双击「Start Translation.bat」。"></p>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/i18n.js?t=__TOKEN__"></script>
<script src="/app.js?t=__TOKEN__"></script>
</body>
</html>
